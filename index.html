<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stundenplan Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Schul-Design: kariertes Heftpapier, Tafel, Textmarker, Rotstift */
:root {
  --bg: #f6f3e9; --grid: rgba(70, 110, 160, .11); --card: #fffdf6; --text: #262a2e; --muted: #6d6b62; --line: #ddd5c2;
  --free: #2f7d32; --free-soft: #d4f0b8; --subst: #c4500f; --subst-soft: #ffd9a8;
  --change: #2b5f9e; --change-soft: #d7e5f7; --exam: #7a3d9e; --exam-soft: #ead9f3;
  --lesson: #f2ede0; --accent: #2f5d4c; --err: #b3261e; --side: #2e463c; --chalk: #f0efe6;
  --wood: #94704a; --margin: rgba(200, 60, 50, .35); --note: #fff1a0; --note-text: #5a4a00;
  --hand: "Patrick Hand", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c2420; --grid: rgba(240, 240, 230, .045); --card: #243029; --text: #ebeae2; --muted: #a9b0a6; --line: #3a4a42;
    --free: #93d68f; --free-soft: #2d4a2f; --subst: #f2a865; --subst-soft: #4d3520;
    --change: #8db8ea; --change-soft: #233a52; --exam: #cf9ee8; --exam-soft: #3d2a4a;
    --lesson: #2b3832; --accent: #8fc7a8; --err: #f08b84; --side: #17201b; --chalk: #ecebe2;
    --wood: #6e5236; --margin: rgba(240, 120, 110, .25); --note: #4a4322; --note-text: #f3e7a6;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: clamp(14px, 0.55vw + 7px, 18px)/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; border: 0; }
h2 { font-size: 1em; margin: 0 0 10px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: clamp(14px, 1.2vw, 24px) clamp(16px, 1.4vw, 28px); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.error { color: var(--err); margin: 10px 0 0; }
.muted { color: var(--muted); font-weight: 400; }
svg.i { width: 1.45em; height: 1.45em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Login ---------- */
#loginView { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
#loginView[hidden] { display: none; }
#loginView .card { width: 100%; max-width: 420px; padding: 24px; }
#loginView h1 { font-size: 22px; margin: 0 0 4px; }
#loginView p.sub { color: var(--muted); margin: 0 0 18px; }
form { display: grid; gap: 10px; }
label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
input { font: inherit; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
.primary { font-weight: 600; padding: 10px 16px; border-radius: 9px; background: var(--accent); color: #fff; }
.primary:disabled { opacity: .6; cursor: wait; }
.link { background: none; color: var(--accent); padding: 0; font-weight: 500; }
.hint { font-size: 12px; color: var(--muted); margin: 12px 0 0; }

/* ---------- Layout mit Seitenleiste ---------- */
#appView { display: grid; grid-template-columns: auto 1fr; min-height: 100vh; }
#appView[hidden] { display: none; }
.side { position: sticky; top: 0; height: 100vh; width: clamp(228px, 15vw, 290px); background: var(--side); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; transition: width .18s ease; overflow: hidden; z-index: 20; }
.side.collapsed { width: calc(1.45em + 38px); }
.side .nav { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 11px; border-radius: 9px;
  background: none; color: var(--muted); text-align: left; white-space: nowrap; font-weight: 500; }
.side .nav:hover { background: var(--lesson); color: var(--text); }
.side .nav.on { background: var(--change-soft); color: var(--accent); }
.side .brand { color: var(--text); font-weight: 700; margin-bottom: 8px; }
.side .label { transition: opacity .15s; }
.side.collapsed .label { opacity: 0; pointer-events: none; }
.side .spacer { flex: 1; }
@media (max-width: 640px) { .side .long { display: none; } }
.side .demo-badge { font-size: 11px; font-weight: 700; color: var(--subst); background: var(--subst-soft); border-radius: 6px;
  padding: 4px 8px; margin: 0 4px 6px; text-align: center; white-space: nowrap; overflow: hidden; }
.side.collapsed .demo-badge { padding: 4px 0; }

.content { min-width: 0; padding: clamp(14px, 1.4vw, 28px) clamp(16px, 1.8vw, 36px) 16px; width: 100%; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; }
.top h1 { font-size: 1.45em; margin: 0 8px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: var(--lesson); color: var(--text); font-weight: 500; padding: .4em .9em; border-radius: 99px; font-size: .93em; }
.chip.on { background: var(--accent); color: #fff; }
.dates { display: flex; align-items: center; gap: 6px; font-size: .93em; color: var(--muted); }
.dates input { padding: .3em .6em; font-size: 1em; border-radius: 7px; }
.range-info { font-size: .86em; color: var(--muted); margin-left: auto; }

.panel[hidden] { display: none; }
.row { display: grid; gap: clamp(10px, 1vw, 18px); margin-bottom: clamp(10px, 1vw, 18px); }
.row.k4 { grid-template-columns: repeat(4, 1fr); }
.row.k3 { grid-template-columns: 1.3fr 1fr 1fr; }
.row.k2 { grid-template-columns: 1fr 1fr; }
.kpi .v { font-size: clamp(28px, 2.7vw, 52px); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--muted); font-size: .86em; }
.kpi.free .v { color: var(--free); } .kpi.subst .v { color: var(--subst); }
.kpi h2 { font-size: .9em; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
.fire { background: linear-gradient(135deg, var(--subst-soft), var(--card) 70%); }
.fire .v { color: var(--subst); }
.flame { display: inline-block; margin-right: 4px; animation: flicker 1.6s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes flicker { 0%,100% { transform: scale(1) rotate(-3deg); } 50% { transform: scale(1.12) rotate(3deg); } }
@media (prefers-reduced-motion: reduce) { .flame { animation: none; } .side { transition: none; } }
.dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 8px; }
.dots span { width: .6em; height: .6em; border-radius: 2px; background: var(--free); }
.notice { background: var(--subst-soft); color: var(--subst); padding: .6em .9em; border-radius: 10px; margin-bottom: clamp(10px, 1vw, 18px); font-size: .93em; }

.bars { display: grid; gap: .55em; }
.bar { display: grid; grid-template-columns: minmax(110px, 22%) 1fr 2.4em; gap: .7em; align-items: center; font-size: .95em; }
.bar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .t { height: .65em; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar .f { display: block; height: 100%; border-radius: 99px; }
.bar .c { text-align: right; font-variant-numeric: tabular-nums; }
.winner { font-size: .93em; margin: -4px 0 10px; color: var(--muted); }
.winner b { color: var(--text); }

.months { display: flex; gap: clamp(10px, 2vw, 40px); align-items: flex-end; height: max(160px, calc(100vh - 36em)); overflow-x: auto; }
.month { flex: 1; min-width: 36px; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; }
.stack { flex: 1; width: 100%; max-width: 90px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
.stack div { border-radius: 3px; }
.month small { color: var(--muted); font-size: .86em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .86em; color: var(--muted); margin-top: 10px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

table { width: 100%; border-collapse: collapse; font-size: .95em; }
th, td { text-align: left; padding: .5em .6em; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: .9em; position: sticky; top: 0; background: var(--card); }
.tag { font-size: .82em; font-weight: 600; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.tag.free { background: var(--free-soft); color: var(--free); }
.tag.subst { background: var(--subst-soft); color: var(--subst); }
.scroll { max-height: calc(100vh - 13em); overflow: auto; }

/* ---------- Stundenplan ---------- */
.plan-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--lesson); border-radius: 9px; padding: 3px; }
.seg button { background: none; color: var(--muted); padding: .4em .95em; font-size: .93em; border-radius: 7px; font-weight: 500; }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.weeknav { display: flex; gap: 4px; align-items: center; font-size: .93em; }
.weeknav button { background: var(--lesson); color: var(--text); padding: .35em .8em; border-radius: 7px; font-weight: 500; }
.weeknav span { min-width: 120px; text-align: center; font-weight: 600; }
.plan-wrap { overflow-x: auto; }
.tt { display: grid; grid-template-columns: 4em repeat(5, minmax(92px, 1fr)); gap: clamp(4px, .45vw, 8px); min-width: 520px; }
.tt .h { font-size: .9em; font-weight: 600; text-align: center; padding: 3px 0; border-radius: 7px; }
.tt .h small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.tt .h.today { background: var(--change-soft); color: var(--change); }
.tt .h.today small { color: var(--change); }
.tt .time { font-size: .8em; color: var(--muted); text-align: right; padding-right: 4px; line-height: 1.2; }
.tt .time b { display: block; color: var(--text); font-size: 1.2em; }
.slot { display: grid; gap: 3px; min-height: max(46px, calc((100vh - 15em) / 6.5)); }
.cell { border-radius: 8px; padding: .45em .7em; font-size: 1em; line-height: 1.25; background: var(--lesson); border-left: 3px solid var(--line); overflow: hidden; }
.cell .s { font-weight: 600; font-size: 1.05em; }
.cell .m { color: var(--muted); font-size: .9em; }
.cell .b { font-size: .78em; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.cell.free { background: var(--free-soft); border-left-color: var(--free); }
.cell.free .s { text-decoration: line-through; opacity: .7; }
.cell.free .b { color: var(--free); }
.cell.subst { background: var(--subst-soft); border-left-color: var(--subst); }
.cell.subst .b { color: var(--subst); }
.cell.change { background: var(--change-soft); border-left-color: var(--change); }
.cell.change .b { color: var(--change); }
.cell.exam { background: var(--exam-soft); border-left-color: var(--exam); }
.cell.exam .b { color: var(--exam); }
.cell.none { background: none; border: 1px dashed var(--line); }
.heat { border-radius: 8px; padding: .4em .65em; font-size: .85em; min-height: max(46px, calc((100vh - 17em) / 6.5)); display: flex; flex-direction: column; justify-content: center; border: 1px solid var(--line); }
.heat b { font-size: 1.3em; }
.heat span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heat .split { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--line); margin: 3px 0 1px; }
.heat .split i { display: block; height: 100%; }
.heat.top { outline: 2px solid var(--text); outline-offset: -2px; }
.heat-sum { font-size: .95em; color: var(--muted); margin: 0 0 8px; }
.heat-sum b { color: var(--text); }

@media (max-width: 900px) {
  .row.k4 { grid-template-columns: 1fr 1fr; }
  .row.k3, .row.k2 { grid-template-columns: 1fr; }
}
/* Tagesansicht & Karten-Liste (nur Handy) */
.days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 10px; }
.days button { background: var(--lesson); color: var(--text); border-radius: 9px; padding: 6px 0; font-weight: 600; font-size: 14px; line-height: 1.2; }
.days button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.days button.today { box-shadow: inset 0 0 0 2px var(--accent); }
.days button.on { background: var(--accent); color: #fff; }
.days button.on small { color: #fff; }
.daylist { display: grid; gap: 6px; }
.dayrow { display: grid; grid-template-columns: 46px 1fr; gap: 8px; align-items: stretch; }
.dayrow .time { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.2; padding-top: 6px; }
.dayrow .time b { display: block; color: var(--text); font-size: 15px; }
.dayrow .slot { min-height: 52px; }
.dayrow .cell { font-size: 15px; padding: 8px 10px; }
.evlist { display: grid; gap: 6px; max-height: none; }
.ev { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 12px; border-radius: 10px; background: var(--lesson); border-left: 3px solid var(--line); }
.ev.free { border-left-color: var(--free); } .ev.subst { border-left-color: var(--subst); }
.ev .s { font-weight: 600; }
.ev .d, .ev .t { font-size: 12px; color: var(--muted); }
.ev .t { grid-column: 1 / -1; }

@media (max-width: 640px) {
  body { font-size: 15px; }
  /* Seitenleiste wird zur Leiste unten */
  #appView { display: block; }
  .side, .side.collapsed { position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: 100%; height: auto;
    flex-direction: row; justify-content: space-around; gap: 0; padding: 4px 4px calc(4px + env(safe-area-inset-bottom));
    border-right: 0; border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
  .side .brand, .side .spacer, .side .demo-badge { display: none; }
  .side .nav { flex-direction: column; gap: 2px; width: auto; flex: 1; padding: 6px 2px; font-size: 10.5px; text-align: center; }
  .side .nav svg.i { width: 22px; height: 22px; }
  .side .label, .side.collapsed .label { opacity: 1; pointer-events: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .content { padding: 12px 12px calc(84px + env(safe-area-inset-bottom)); }
  .top { gap: 8px; }
  .top h1 { width: 100%; font-size: 22px; }
  .chips { width: 100%; }
  .chip { flex: 1; text-align: center; padding: 7px 4px; }
  .dates { width: 100%; }
  .dates input { flex: 1; font-size: 16px; min-width: 0; }
  .range-info { margin-left: 0; }
  .card { padding: 12px 14px; }
  .kpi .v { font-size: 30px; }
  .row { gap: 8px; margin-bottom: 8px; }
  .bar { grid-template-columns: 84px 1fr 28px; }
  .months { height: 170px; gap: 8px; }
  .plan-head { flex-direction: column; align-items: stretch; }
  .plan-head .seg { display: grid; grid-template-columns: repeat(4, 1fr); }
  .plan-head .seg button { padding: 7px 2px; }
  #evFilter { grid-template-columns: repeat(3, 1fr) !important; }
  #evFilter button { white-space: nowrap; }
  .row.k3 { grid-template-columns: 1fr 1fr; }
  .row.k3 > :first-child { grid-column: 1 / -1; }
  .weeknav { justify-content: space-between; }
  .weeknav span { min-width: 0; flex: 1; }
  .tt { min-width: 0; grid-template-columns: 30px repeat(5, 1fr); gap: 3px; }
  .tt .time { font-size: 0; padding-right: 2px; }
  .tt .time b { font-size: 13px; }
  .heat { min-height: 50px; padding: 4px 2px; text-align: center; align-items: center; }
  .heat b { font-size: 17px; }
  .heat span { font-size: 10px; }
  .heat .split { width: 100%; }
  .scroll { max-height: none; }
}
.modal { position: fixed; inset: 0; background: rgba(20, 25, 20, .45); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal[hidden] { display: none; }
.modal-box { width: 100%; max-width: 440px; max-height: 90vh; overflow: auto; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.modal-head h2 { margin: 0; }
.modal-x { background: none; color: var(--muted); font-size: 26px; line-height: 1; padding: 0 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.modal-actions:empty { display: none; }
#modalBody { display: grid; gap: 10px; margin-top: 10px; }
.tt.compact { grid-template-columns: 26px repeat(5, minmax(0, 1fr)); gap: 3px; min-width: 0; }
.tt.compact .slot { min-height: 0; gap: 2px; }
.tt.compact .cell { padding: 4px 3px 4px 4px; font-size: 11.5px; min-height: 44px; cursor: pointer; border-left-width: 3px; }
.tt.compact .cell .s { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt.compact .cell .m { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tt.compact .h { font-size: 13px; }
.tt.compact .h small { display: block; margin: 0; font-size: 10px; }
.tt.compact .time { font-size: 0; }
.tt.compact .time b { font-size: 16px; }

.refresh-wrap { display: flex; align-items: center; gap: 8px; }
.refresh { background: var(--card); color: var(--accent); border: 1px solid var(--line); border-radius: 4px; padding: .35em .85em; font-weight: 700; font-size: .93em; box-shadow: 0 2px 0 var(--line); }
.refresh:disabled { opacity: .7; cursor: wait; }
.refresh .ico { display: inline-block; }
.refresh.busy .ico { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .refresh.busy .ico { animation: none; } }
.loaded-at { color: var(--muted); font-size: .8em; white-space: nowrap; }
@media (max-width: 640px) { .refresh-wrap { width: 100%; justify-content: space-between; } }

/* ---------- Spiele (eigener, ruhiger Look in natürlichen Farben) ---------- */
#appView.no-range .top > :not(h1) { display: none; }
.arcade, #appView.games-mode .content {
  --a-bg: #23211e; --a-panel: #2d2a26; --a-panel2: #34302b; --a-line: #423d36; --a-text: #f1ece3; --a-muted: #a99f91;
  --a-sage: #9db58f; --a-sand: #e2c690; --a-terra: #d4825f; --a-slate: #8aa3b8; --a-clay: #c78f86; --a-olive: #b9b46e; }
#appView.games-mode .content { background: radial-gradient(900px 500px at 10% -10%, #322e29 0%, transparent 70%), var(--a-bg); min-height: 100vh; color: var(--a-text); }
#appView.games-mode .top h1 { font-family: "Nunito", system-ui, sans-serif; font-weight: 900; letter-spacing: -.01em; color: var(--a-text); font-size: 1.7em; }
.arcade { color: var(--a-text); font-family: "Nunito", system-ui, sans-serif; }
.arcade button { font-family: inherit; }
.arcade-home { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: clamp(12px, 1.2vw, 20px); }
.game-card { --c: var(--a-sage); display: flex; flex-direction: column; text-align: left; gap: 4px; color: var(--a-text);
  background: var(--a-panel); border: 1px solid var(--a-line); border-radius: 14px; padding: 12px; cursor: pointer;
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; box-shadow: 0 2px 0 rgba(0, 0, 0, .15); }
.game-card:hover, .game-card:focus-visible { transform: translateY(-2px); border-color: var(--c); box-shadow: 0 10px 24px rgba(0, 0, 0, .3); outline: none; }
.game-card svg { width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 9px; margin-bottom: 8px; display: block; }
.game-card h3 { margin: 0; font-size: 1.15em; font-weight: 800; }
.game-card p { margin: 0; color: var(--a-muted); font-size: .9em; }
.game-card .best { margin-top: 6px; font-size: .8em; font-weight: 700; color: var(--c); }
.arcade-view { display: flex; flex-direction: column; gap: 12px; }
.arcade-view[hidden], .arcade-home[hidden] { display: none; }
.arcade-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.arcade-back { background: var(--a-panel); color: var(--a-text); border: 1px solid var(--a-line); border-radius: 99px; padding: 6px 14px; font-weight: 700; }
.arcade-back:hover { border-color: var(--a-sand); }
.arcade-title { font-size: 1.25em; font-weight: 800; }
.arcade-score { margin-left: auto; color: var(--a-muted); font-variant-numeric: tabular-nums; }
.arcade-score b { color: var(--a-text); }
.arcade-stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.arcade-help { margin: 0; text-align: center; color: var(--a-muted); font-size: .88em; }
.game-canvas { display: block; border-radius: 12px; touch-action: none; user-select: none; -webkit-user-select: none;
  box-shadow: 0 0 0 1px var(--a-line), 0 18px 40px rgba(0, 0, 0, .35); }
.dpad { display: none; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 46px); gap: 6px; }

.pc { position: relative; z-index: 1; width: 90%; height: 90%; pointer-events: none; filter: drop-shadow(0 .5cqi .45cqi rgba(30, 20, 10, .38)); transition: transform .15s ease; will-change: transform; }

@keyframes think { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = (iso) => new Date(iso + "T12:00").toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
const fmtShort = (iso) => new Date(iso + "T12:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
const fmtTime = (t) => String(Math.floor(t / 100)).padStart(2, "0") + ":" + String(t % 100).padStart(2, "0");
const monthName = (m) => new Date(m + "-15").toLocaleDateString("de-DE", { month: "short" });
const addDays = (iso, n) => { const d = new Date(iso + "T12:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const DAYS = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag"];
const TABS = { home: "Übersicht", teachers: "Lehrkräfte", events: "Ausfälle & Vertretungen", plan: "Stundenplan", games: "Spiele" };
const store = {
  get(k, area = localStorage) { try { return area.getItem(k); } catch { return null; } },
  set(k, v, area = localStorage) { try { area.setItem(k, v); } catch {} },
  del(k, area = localStorage) { try { area.removeItem(k); } catch {} },
};

const state = { session: null, info: null, stats: null, weekDate: null, view: "week", week: null, filter: "all", day: null };
const phone = window.matchMedia("(max-width: 640px)");
phone.addEventListener("change", () => { if (state.stats) { renderEvents(state.stats); renderPlan(); } });

$("#username").value = store.get("untisUser") || "";

/* ---------- Dialog ---------- */

let modalSubmit = null;
function openModal({ title, body = "", submit, onSubmit }) {
  $("#modalTitle").textContent = title;
  $("#modalBody").innerHTML = body;
  $("#modalError").hidden = true;
  $("#modalActions").innerHTML = submit ? `<button type="submit" class="primary">${esc(submit)}</button>` : "";
  modalSubmit = onSubmit || null;
  $("#modal").hidden = false;
  const first = $("#modalBody input");
  if (first) first.focus();
}
function closeModal() { $("#modal").hidden = true; modalSubmit = null; }
$("#modalClose").addEventListener("click", closeModal);
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#modal").hidden) closeModal(); });
$("#modalForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!modalSubmit) return closeModal();
  const btn = $("#modalActions button");
  if (btn) btn.disabled = true;
  try {
    const values = Object.fromEntries(new FormData($("#modalForm")).entries());
    await modalSubmit(values);
    closeModal();
  } catch (err) {
    $("#modalError").textContent = err.message;
    $("#modalError").hidden = false;
  } finally { if (btn) btn.disabled = false; }
});

/* ---------- Server ---------- */

async function api(path, body) {
  const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!data.ok) {
    if (data.expired) showLogin();
    throw new Error(data.error || "Fehler");
  }
  return data;
}

function showError(e, where = "#appError") {
  const el = $(where);
  el.textContent = e.message === "Failed to fetch" ? "Server läuft nicht – starte server.py." : e.message;
  el.hidden = false;
}

function showLogin() {
  store.del("tracker", sessionStorage);
  state.session = null;
  $("#appView").hidden = true;
  $("#loginView").hidden = false;
}

async function login(body) {
  $("#error").hidden = true;
  $("#go").disabled = true;
  $("#go").textContent = "Lade Stundenplan…";
  try {
    const info = await api("/api/login", body);
    store.set("tracker", JSON.stringify(info), sessionStorage);
    start(info);
  } catch (e) {
    showError(e, "#error");
  } finally {
    $("#go").disabled = false;
    $("#go").textContent = "Auswerten";
  }
}

function start(info, fresh) {
  state.session = info.session;
  state.info = info;
  state.weekDate = info.today;
  $("#loginView").hidden = true;
  $("#appView").hidden = false;
  $("#appError").hidden = true;
  $("#demoBadge").hidden = !info.demo;
  $("#from").min = $("#to").min = info.year.from;
  $("#from").max = $("#to").max = info.year.to;
  setTab(location.hash.slice(1) in TABS ? location.hash.slice(1) : "home");
  showLoadedAt();
  if (fresh) setRange(info.year.from, info.today);
  else setRange(info.year.from, info.today, info.stats);
  loadWeek();
}

$("#login").addEventListener("submit", (e) => {
  e.preventDefault();
  const username = $("#username").value.trim();
  store.set("untisUser", username);
  login({ username, password: $("#password").value });
});
$("#demo").addEventListener("click", () => login({ demo: true }));
$("#logout").addEventListener("click", () => {
  // Sitzung (und gemerktes Passwort) auch auf dem Server löschen
  if (state.session) fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: state.session }) }).catch(() => {});
  $("#password").value = "";
  showLogin();
});

/* ---------- Aktualisieren ---------- */

const AUTO_REFRESH_SECONDS = 30 * 60;

function showLoadedAt() {
  const t = state.info && state.info.loadedAt;
  $("#loadedAt").textContent = t ? "Stand " + new Date(t * 1000).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) : "";
  $("#loadedAt").title = t ? "Zuletzt aus Untis geladen: " + new Date(t * 1000).toLocaleString("de-DE") : "";
}

async function refresh(auto) {
  if (!state.session || $("#refresh").disabled) return;
  const btn = $("#refresh");
  btn.disabled = true;
  btn.classList.add("busy");
  $("#refreshLabel").textContent = "Lädt…";
  $("#appError").hidden = true;
  const key = ($("#chips .chip.on") || {}).dataset?.key;
  try {
    const info = await api("/api/refresh", { session: state.session });
    state.info = info;
    store.set("tracker", JSON.stringify(info), sessionStorage);
    $("#from").min = $("#to").min = info.year.from;
    $("#from").max = $("#to").max = info.year.to;
    showLoadedAt();
    const r = key && key !== "custom" ? ranges().find((x) => x.key === key) : null;
    if (r && key === "year") await setRange(r.from, r.to, info.stats);
    else if (r) await setRange(r.from, r.to);
    else await setRange($("#from").value, $("#to").value);
    await loadWeek();
  } catch (e) {
    if (!auto) showError(e);
  } finally {
    btn.disabled = false;
    btn.classList.remove("busy");
    $("#refreshLabel").textContent = "Aktualisieren";
  }
}

$("#refresh").addEventListener("click", () => refresh(false));

// Automatisch neu laden, wenn der Stand älter als 30 Minuten ist
function autoRefresh() {
  if (document.hidden || !state.info || !state.info.loadedAt) return;
  if (Date.now() / 1000 - state.info.loadedAt > AUTO_REFRESH_SECONDS) refresh(true);
}
document.addEventListener("visibilitychange", autoRefresh);
setInterval(autoRefresh, 5 * 60 * 1000);


/* ---------- Seitenleiste & Tabs ---------- */

function setCollapsed(c) {
  $("#side").classList.toggle("collapsed", c);
  $("#sideToggle").setAttribute("aria-expanded", String(!c));
  store.set("sideCollapsed", c ? "1" : "0");
}
setCollapsed(store.get("sideCollapsed") ? store.get("sideCollapsed") === "1" : window.innerWidth < 640);
$("#sideToggle").addEventListener("click", () => setCollapsed(!$("#side").classList.contains("collapsed")));

function setTab(tab) {
  $$(".side [data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $$(".panel").forEach((p) => (p.hidden = p.dataset.panel !== tab));
  $("#tabTitle").textContent = TABS[tab];
  history.replaceState(null, "", "#" + tab);
  $("#appView").classList.toggle("no-range", tab === "games");
  $("#appView").classList.toggle("games-mode", tab === "games");
  if (window.Games) window.Games.tab(tab === "games");
  if (tab === "plan") renderPlan();
}
$$(".side [data-tab]").forEach((b) => b.addEventListener("click", () => {
  setTab(b.dataset.tab);
  if (window.innerWidth < 640) setCollapsed(true);
}));

/* ---------- Zeitraum ---------- */

function ranges() {
  const r = state.info.ranges.map((x) => ({ ...x, label: { year: "Schuljahr", h1: "1. Halbjahr", h2: "2. Halbjahr" }[x.key] || x.label }));
  r[0].to = state.info.today; // ganzes Schuljahr = Schulstart bis heute
  return r;
}

function renderChips(from, to) {
  const list = ranges();
  const match = list.find((r) => r.from === from && r.to === to);
  $("#chips").innerHTML = list.map((r) =>
    `<button type="button" class="chip ${match && match.key === r.key ? "on" : ""}" data-key="${r.key}">${r.label}</button>`
  ).join("") + `<button type="button" class="chip ${match ? "" : "on"}" data-key="custom">Eigener</button>`;
}

$("#chips").addEventListener("click", (e) => {
  const key = e.target.dataset.key;
  if (!key) return;
  if (key === "custom") { $("#from").focus(); return; }
  const r = ranges().find((x) => x.key === key);
  setRange(r.from, r.to);
});

async function setRange(from, to, preloaded) {
  $("#from").value = from;
  $("#to").value = to;
  renderChips(from, to);
  try {
    const stats = preloaded || (await api("/api/stats", { session: state.session, from, to })).stats;
    state.stats = stats;
    $("#rangeInfo").textContent = stats.empty ? "Zeitraum hat noch nicht begonnen" : `ausgewertet ${fmtShort(stats.from)} – ${fmtShort(stats.to)}`;
    renderStats(stats);
    if (state.view !== "week") renderPlan();
  } catch (e) { showError(e); }
}

for (const id of ["#from", "#to"]) {
  $(id).addEventListener("change", () => {
    if ($("#from").value && $("#to").value) setRange($("#from").value, $("#to").value);
  });
}

/* ---------- Statistik ---------- */

function bars(list, color, empty) {
  if (!list.length) return `<p class="empty">${empty}</p>`;
  const max = list[0].count;
  return `<div class="bars">` + list.slice(0, 8).map((x) => `
    <div class="bar"><span class="n" title="${esc(x.name)}">${esc(x.name)}</span>
      <span class="t"><span class="f" style="width:${(x.count / max) * 100}%;background:${color}"></span></span>
      <span class="c">${x.count}</span></div>`).join("") + `</div>`;
}

function winner(list, text) {
  if (!list.length) return "";
  const top = list.filter((x) => x.count === list[0].count).map((x) => esc(x.name)).join(", ");
  return `<p class="winner">${text}: <b>${top}</b> (${list[0].count}×)</p>`;
}

function panel(title, list, color, text, empty) {
  return `<div class="card"><h2>${title}</h2>${winner(list, text)}${bars(list, color, empty)}</div>`;
}

function mergeSubjects(s) {
  const map = {};
  s.freeBySubject.forEach((x) => (map[x.name] = (map[x.name] || 0) + x.count));
  s.substBySubject.forEach((x) => (map[x.name] = (map[x.name] || 0) + x.count));
  return Object.entries(map).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count);
}

function period6Cards(p) {
  if (!p || !p.slot) return `<div class="card" style="grid-column:1/-1"><p class="empty">Die 6. Stunde konnte im Stundenplan nicht erkannt werden.</p></div>`;
  const quote = p.days ? Math.round((p.free / p.days) * 100) : 0;
  const best = p.best ? (p.bestFrom === p.bestTo ? fmtShort(p.bestFrom) : fmtShort(p.bestFrom) + " – " + fmtShort(p.bestTo)) : "noch keine";
  const now = p.streak ? (p.streak === 1 ? "6. Stunde zuletzt frei" : "6. Stunden in Folge frei") : "letzte 6. Stunde fand statt";
  return `
    <div class="card kpi"><h2>6. Stunde frei <span class="muted">${fmtTime(p.slot[0])}–${fmtTime(p.slot[1])}</span></h2>
      <div class="v" style="color:var(--free)">${p.free}×</div>
      <div class="l">von ${p.days} Tagen (${quote} %)</div>
      <div class="dots" title="Jedes Kästchen = eine freie 6. Stunde">${"<span></span>".repeat(p.free)}</div></div>
    <div class="card kpi"><h2>Aktuelle Streak</h2><div class="v">${p.streak}</div><div class="l">${now}</div></div>
    <div class="card kpi fire"><h2>Höchste Streak</h2><div class="v"><span class="flame">🔥</span> ${p.best}</div><div class="l">${best}</div></div>`;
}

function renderStats(s) {
  if (s.empty) {
    const msg = `<div class="card"><p class="empty">Dieser Zeitraum hat noch nicht begonnen – hier gibt es noch nichts auszuwerten.</p></div>`;
    $("#home").innerHTML = $("#teachers").innerHTML = $("#events").innerHTML = msg;
    return;
  }
  renderHome(s);
  renderTeachers(s);
  renderEvents(s);
}

function renderHome(s) {
  const pct = (n) => (s.total ? ((n / s.total) * 100).toFixed(1).replace(".", ",") : "0") + " %";
  const hours = (s.freeMinutes / 60).toFixed(1).replace(".", ",");
  const maxMonth = Math.max(1, ...s.months.map((m) => m.free + m.subst));
  $("#home").innerHTML = `
    <div class="row k4">
      <div class="card kpi free"><h2>Stunden frei</h2><div class="v">${s.free}</div><div class="l">${pct(s.free)} aller Stunden</div></div>
      <div class="card kpi subst"><h2>Stunden Vertretung</h2><div class="v">${s.subst}</div><div class="l">${pct(s.subst)} aller Stunden</div></div>
      <div class="card kpi"><h2>Zeit geschenkt</h2><div class="v">${hours} h</div><div class="l">Zeitstunden frei</div></div>
      <div class="card kpi"><h2>Komplett freie Tage</h2><div class="v">${s.freeDays.length}</div><div class="l">Schultage ohne Unterricht</div></div>
    </div>
    <div class="row k3">${period6Cards(s.period6)}</div>
    ${s.manual.length ? `<div class="notice">Davon ${s.manual.length} Vertretungsstunde${s.manual.length === 1 ? "" : "n"} nachgetragen:
      ${esc([...new Set(s.manual.flatMap((m) => m.current))].join(", "))} war fest als Vertretung eingesetzt
      (${s.manual.map((m) => fmtShort(m.date)).join(", ")}).</div>` : ""}
    <div class="card"><h2>Verlauf pro Monat</h2>
      <div class="months">${s.months.map((m) => `
        <div class="month" title="${m.free} frei, ${m.subst} Vertretung von ${m.total} Stunden">
          <div class="stack">
            <div style="height:${(m.subst / maxMonth) * 100}%;background:var(--subst)"></div>
            <div style="height:${(m.free / maxMonth) * 100}%;background:var(--free)"></div>
          </div>
          <small>${monthName(m.month)}</small>
        </div>`).join("")}</div>
      <div class="legend"><span><span class="dot" style="background:var(--free)"></span>frei</span>
        <span><span class="dot" style="background:var(--subst)"></span>Vertretung</span>
        <span>insgesamt ${s.total} Stunden laut Plan</span></div>
    </div>`;
}

function renderTeachers(s) {
  $("#teachers").innerHTML = `
    <div class="row k2">
      ${panel("Frei bei welcher Lehrkraft", s.freeByTeacher, "var(--free)", "Am meisten frei bei", "Kein Ausfall in diesem Zeitraum.")}
      ${panel("Vertretung, weil diese Lehrkraft fehlte", s.substByTeacher, "var(--subst)", "Am meisten gefehlt", "Keine Vertretung in diesem Zeitraum.")}
    </div>
    <div class="row k2">
      ${panel("Wer hat am meisten vertreten", s.substitutes, "var(--accent)", "Häufigste Vertretung", "Keine Angaben.")}
      <div class="card"><h2>Nach Fach (frei + Vertretung)</h2>${bars(mergeSubjects(s), "var(--free)", "Keine Daten.")}</div>
    </div>`;
}

function renderEvents(s) {
  const nFree = s.events.filter((e) => e.free).length;
  const list = s.events.filter((e) => state.filter === "all" || (state.filter === "free" ? e.free : !e.free));
  $("#events").innerHTML = `<div class="card">
    <div class="plan-head">
      <div class="seg" id="evFilter">
        <button data-f="all" class="${state.filter === "all" ? "on" : ""}" type="button">Alle (${s.events.length})</button>
        <button data-f="free" class="${state.filter === "free" ? "on" : ""}" type="button">Frei (${nFree})</button>
        <button data-f="subst" class="${state.filter === "subst" ? "on" : ""}" type="button">${phone.matches ? "Vertr." : "Vertretung"} (${s.events.length - nFree})</button>
      </div>
    </div>
    ${list.length && phone.matches ? `<div class="evlist">${list.map((e) => `
      <div class="ev ${e.free ? "free" : "subst"}">
        <span class="s">${esc(e.subject)}</span>
        ${e.free ? '<span class="tag free">frei</span>' : `<span class="tag subst">Vertretung${e.manual ? " *" : ""}</span>`}
        <span class="d">${fmtDate(e.date)} · ${fmtTime(e.start)}</span>
        <span class="t">${esc(e.original.join(", "))}${e.status === "substitution" && e.current.length ? " → " + esc(e.current.join(", ")) : ""}</span>
      </div>`).join("")}</div>
      ${s.manual.length ? `<p class="hint">* nachgetragen, in Untis als normaler Unterricht eingetragen</p>` : ""}`
    : list.length ? `<div class="scroll"><table>
      <thead><tr><th>Datum</th><th>Zeit</th><th>Fach</th><th>Art</th><th>Lehrkraft</th></tr></thead>
      <tbody>${list.map((e) => `<tr>
        <td>${fmtDate(e.date)}</td><td>${fmtTime(e.start)}</td><td>${esc(e.subject)}</td>
        <td>${e.free ? '<span class="tag free">frei</span>' : `<span class="tag subst">Vertretung${e.manual ? " *" : ""}</span>`}</td>
        <td>${esc(e.original.join(", "))}${e.status === "substitution" && e.current.length ? " → " + esc(e.current.join(", ")) : ""}</td>
      </tr>`).join("")}</tbody></table></div>
      ${s.manual.length ? `<p class="hint">* nachgetragen, in Untis als normaler Unterricht eingetragen</p>` : ""}`
      : `<p class="empty">In diesem Zeitraum lief alles nach Plan.</p>`}
  </div>`;
  $$("#evFilter [data-f]").forEach((b) => b.addEventListener("click", () => { state.filter = b.dataset.f; renderEvents(s); }));
}

/* ---------- Stundenplan ---------- */

async function loadWeek() {
  try {
    state.week = await api("/api/week", { session: state.session, date: state.weekDate });
    if (state.view === "week") renderPlan();
  } catch (e) { showError(e); }
}

$("#prev").addEventListener("click", () => { state.weekDate = addDays(state.weekDate, -7); if (state.day) state.day = addDays(state.day, -7); loadWeek(); });
$("#next").addEventListener("click", () => { state.weekDate = addDays(state.weekDate, 7); if (state.day) state.day = addDays(state.day, 7); loadWeek(); });
$("#thisWeek").addEventListener("click", () => { state.weekDate = state.info.today; state.day = null; loadWeek(); });
$$(".seg [data-view]").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));

function setView(v) {
  state.view = v;
  $$(".seg [data-view]").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  $("#weeknav").style.visibility = v === "week" ? "visible" : "hidden";
  renderPlan();
}

function renderPlan() {
  if (!state.info) return;
  if (state.view === "week") renderWeek(); else renderHeat(state.view);
}

const SHORT = { "Mathematik": "Mathe", "Wirtschaft und Verwaltung": "WuV", "Ethikunterricht": "Ethik",
  "Bildende Kunst": "Kunst", "Sozialkunde": "Sozi", "Geschichte": "Gesch.", "Englisch": "Engl.",
  "Biologie": "Bio", "Erdkunde": "Erdk.", "Französisch": "Franz.", "Informatik": "Info", "Religion": "Reli" };

function cellFor(l, compact) {
  const teachers = l.status === "substitution"
    ? `${esc(l.original.join(", "))} → <b>${esc(l.current.join(", ") || "?")}</b>`
    : esc((l.current.length ? l.current : l.original).join(", "));
  let cls = "", badge = "";
  if (l.free) { cls = "free"; badge = "frei"; }
  else if (l.status === "substitution") { cls = "subst"; badge = l.manual ? "Vertretung *" : "Vertretung"; }
  else if (l.status === "change" || l.status === "additional") { cls = "change"; badge = l.status === "additional" ? "Zusatz" : "geändert"; }
  else if (l.status === "exam") { cls = "exam"; badge = "Prüfung"; }
  if (compact) {
    const i = state.weekLessons.push(l) - 1;
    const who = l.status === "substitution" ? (l.current.join(", ") || "?") : (l.current.length ? l.current : l.original).join(", ");
    return `<div class="cell ${cls}" data-li="${i}" role="button" tabindex="0">
      <div class="s">${esc(SHORT[l.subject] || l.subject)}</div>
      <div class="m">${l.free ? "frei" : esc(who)}</div>
    </div>`;
  }
  return `<div class="cell ${cls}" title="${esc(l.text)}">
    ${badge ? `<div class="b">${badge}</div>` : ""}
    <div class="s">${esc(l.subject)}${l.statt ? ` <span class="muted">statt ${esc(l.statt)}</span>` : ""}</div>
    <div class="m">${teachers}${l.room ? " · " + esc(l.room) : ""}</div>
  </div>`;
}

function renderWeek() {
  const w = state.week;
  if (!w) return;
  $("#weekLabel").textContent = `${fmtShort(w.days[0])} – ${fmtShort(w.days[4])}`;
  const outside = w.days[4] < state.info.year.from || w.days[0] > state.info.loadedTo;
  const compact = phone.matches;
  state.weekLessons = [];
  let html = `<div class="tt ${compact ? "compact" : ""}"><div></div>` + w.days.map((d, i) =>
    `<div class="h ${d === w.today ? "today" : ""}">${DAYS[i].slice(0, 2)}<small>${fmtShort(d)}</small></div>`).join("");
  for (const g of w.grid) {
    html += `<div class="time"><b>${esc(g.name)}.</b>${fmtTime(g.start)}</div>`;
    for (const d of w.days) {
      const ls = w.lessons.filter((l) => l.date === d && l.start < g.end && g.start < l.end
        && !(l.status === "cancelled" && !l.free));
      html += `<div class="slot">${ls.length ? ls.map((l) => cellFor(l, compact)).join("") : `<div class="cell none"></div>`}</div>`;
    }
  }
  html += `</div>`;
  if (outside) html = `<p class="empty">Für diese Woche gibt es keine Daten (geladen bis ${fmtDate(state.info.loadedTo)}).</p>`;
  $("#plan").innerHTML = html;
  $$("#plan .cell[data-li]").forEach((c) => c.addEventListener("click", () => showLesson(state.weekLessons[c.dataset.li])));
  renderWeekLegend();
}

function showLesson(l) {
  openModal({ title: `${DAYS[new Date(l.date + "T12:00").getDay() - 1] || ""}, ${fmtShort(l.date)} · ${fmtTime(l.start)}–${fmtTime(l.end)}`,
    body: cellFor(l) + (l.text ? `<p class="hint">${esc(l.text)}</p>` : "") });
}

function renderWeekLegend() {
  $("#planLegend").innerHTML = `
    <span><span class="dot" style="background:var(--free)"></span>frei</span>
    <span><span class="dot" style="background:var(--subst)"></span>Vertretung (* nachgetragen)</span>
    <span><span class="dot" style="background:var(--change)"></span>geändert / Zusatz</span>
    <span><span class="dot" style="background:var(--exam)"></span>Prüfung</span>`;
}

const HEAT = {
  free:  { value: (c) => c.free, color: "var(--free)", word: "frei", short: "frei",
           legend: "Je grüner, desto öfter war die Stunde im gewählten Zeitraum frei." },
  subst: { value: (c) => c.subst, color: "var(--subst)", word: "Vertretung", short: "Vertr.",
           legend: "Je oranger, desto öfter gab es in dieser Stunde Vertretung." },
  both:  { value: (c) => c.free + c.subst, color: "var(--accent)", word: "nicht nach Plan", short: "gesamt",
           legend: "Frei und Vertretung zusammen: je blauer, desto öfter lief die Stunde nicht nach Plan. Der Balken zeigt grün = frei, orange = Vertretung." },
};

function renderHeat(mode) {
  const s = state.stats, grid = state.info.grid, h = HEAT[mode];
  if (!s || s.empty) { $("#plan").innerHTML = `<p class="empty">Für diesen Zeitraum gibt es noch keine Daten.</p>`; $("#planLegend").innerHTML = ""; return; }
  const max = Math.max(...s.heat.flat().map(h.value));
  const tops = [];
  grid.forEach((g, i) => { for (let wd = 0; wd < 5; wd++) if (max > 0 && h.value(s.heat[wd][i]) === max) tops.push(`${DAYS[wd]} ${g.name}. Stunde`); });
  let html = `<p class="heat-sum">${max > 0
      ? `Am häufigsten ${h.word}: <b>${tops.join(", ")}</b> (${max}×)`
      : `In diesem Zeitraum gab es keine Stunde mit ${mode === "free" ? "Ausfall" : h.word}.`}</p>`;
  html += `<div class="tt"><div></div>` + DAYS.map((d) => `<div class="h">${d.slice(0, 2)}</div>`).join("");
  grid.forEach((g, i) => {
    html += `<div class="time"><b>${esc(g.name)}.</b>${fmtTime(g.start)}</div>`;
    for (let wd = 0; wd < 5; wd++) {
      const c = s.heat[wd][i];
      if (!c.total) { html += `<div class="heat" style="border-style:dashed"></div>`; continue; }
      const v = h.value(c), a = max ? v / max : 0;
      if (phone.matches) {
        html += `<div class="heat ${v && v === max ? "top" : ""}" style="background:color-mix(in srgb, ${h.color} ${Math.round(a * 55)}%, var(--card))">
          <b>${v}</b>${mode === "both"
            ? `<span class="split"><i style="width:${v ? (c.free / v) * 100 : 0}%;background:var(--free)"></i><i style="width:${v ? (c.subst / v) * 100 : 0}%;background:var(--subst)"></i></span>`
            : `<span>${Math.round((v / c.total) * 100)} %</span>`}</div>`;
        continue;
      }
      const detail = mode === "both"
        ? `<span class="split"><i style="width:${v ? (c.free / v) * 100 : 0}%;background:var(--free)"></i><i style="width:${v ? (c.subst / v) * 100 : 0}%;background:var(--subst)"></i></span>
           <span>${c.free}× frei · ${c.subst}× Vertr.</span>`
        : `<span>${Math.round((v / c.total) * 100)} % · ${mode === "free" ? `${c.subst}× Vertr.` : `${c.free}× frei`}</span>`;
      html += `<div class="heat ${v && v === max ? "top" : ""}" style="background:color-mix(in srgb, ${h.color} ${Math.round(a * 55)}%, var(--card))"
        title="${DAYS[wd]}, ${g.name}. Stunde: ${c.free}× frei, ${c.subst}× Vertretung von ${c.total} Stunden">
        <b>${v}× ${h.short}</b>${detail}</div>`;
    }
  });
  $("#plan").innerHTML = html + `</div>`;
  $("#planLegend").innerHTML = `<span>${h.legend} Umrandet = Spitzenreiter.</span>`;
}

// Nach dem Neuladen angemeldet bleiben (solange der Server läuft)
try {
  const saved = JSON.parse(store.get("tracker", sessionStorage) || "null");
  if (saved && saved.session) start(saved, true);
} catch {}
autoRefresh();
</script>
<script>
/* ---------- Spiele ---------- */
window.Games = (() => {
  // Ruhige, natürliche Farben
  const C = { bg: "#23211e", panel: "#2d2a26", line: "#423d36", text: "#f1ece3", muted: "#a99f91", cream: "#f6f1e6",
              sage: "#9db58f", sand: "#e2c690", terra: "#d4825f", slate: "#8aa3b8", clay: "#c78f86", olive: "#b9b46e",
              wood: "#b98b5e", woodDark: "#8a6342", ink: "#1f1b17" };
  const FONT = '"Nunito", system-ui, sans-serif';
  let stopCurrent = null, isOpen = false;

  /* ---- Hilfen für Canvas-Spiele ---- */

  function stage(W, H) {
    const c = document.createElement("canvas");
    c.className = "game-canvas";
    c.style.aspectRatio = `${W} / ${H}`;
    c.style.width = `min(100%, calc((100dvh - 15em) * ${(W / H).toFixed(4)}))`;
    $("#gameHost").appendChild(c);
    const ctx = c.getContext("2d");
    const fit = () => {
      const r = c.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
      if (!r.width) return;
      c.width = Math.round(r.width * dpr);
      c.height = Math.round((r.width * H / W) * dpr);
      ctx.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
    };
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(c);
    const point = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
    };
    return { c, ctx, W, H, point, done: () => ro.disconnect() };

  function loop(step, draw) {

      last = t;
      while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
      draw();
      raf = requestAnimationFrame(frame);
    };
    raf = requestAnimationFrame(frame);
    return () => { on = false; cancelAnimationFrame(raf); };
  }

  function keys(onPress) {
    const down = new Set();
    const norm = (e) => (e.key.length === 1 ? e.key.toLowerCase() : e.key);
    const kd = (e) => {
      if (!isOpen || $("#gameView").hidden || (e.target.matches && e.target.matches("input, textarea, select"))) return;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
      const k = norm(e);
      if (!down.has(k) && onPress) onPress(k);
      down.add(k);
    };
    const ku = (e) => down.delete(norm(e));
    const blur = () => down.clear();
    addEventListener("keydown", kd);
    addEventListener("keyup", ku);
    addEventListener("blur", blur);

      has: (...k) => k.some((x) => down.has(x)),

  };
  const PATHS = new Map();
  const path2d = (d) => { if (!PATHS.has(d)) PATHS.set(d, new Path2D(d)); return PATHS.get(d); };

  // Gute Extras = runde Münze (grün), schlechte = Sechseck (orange)

    ctx.globalAlpha = 0.18;
    ctx.fillStyle = good ? C.sage : C.terra;
    dot(ctx, 0, 0, r * 1.5 * pulse);
    ctx.globalAlpha = 1;

  function effects() {

      add(id, frames, ic, good) { list.set(id, { left: frames, total: frames, ic, good }); },
      has: (id) => list.has(id),
      del: (id) => list.delete(id),
      clear: () => list.clear(),
      step() { for (const [k, e] of list) if (--e.left <= 0) list.delete(k); },
      // Runde Abzeichen mit ablaufendem Zeitring
      draw(ctx, x, y, right) {

  function pick(weights) {

  /* ================= Pong (mit Spin) ================= */
  function pong() {

    const show = () => setScore(`Du <b>${score[0]}</b> : <b>${score[1]}</b> Computer · Siege ${best("pong")}`);
    function reset() {
      me = { x: W / 2 - PW / 2, y: H - 36, vx: 0 };
      ai = { x: W / 2 - PW / 2, y: 24, vx: 0 };
      score = [0, 0];
      serve(1);
      show();
    }
    function serve(dir) {
      const a = (Math.random() - 0.5) * 0.8;
      ball = { x: W / 2, y: H / 2, r: 7, sp: 4.4, vx: Math.sin(a) * 4.4, vy: Math.cos(a) * 4.4 * dir, z: 0, spin: 0, rot: 0, trail: [] };
      pause = 55;
    }
    function start() { if (state === "over") reset(); state = "play"; }
    const k = keys((key) => { if ((key === " " || key === "Enter") && state !== "play") start(); });
    s.c.addEventListener("pointerdown", (e) => { target = s.point(e).x; if (state !== "play") start(); });
    s.c.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" || e.buttons) target = s.point(e).x; });

    // side = Ball trifft die Kante des Schlägers → flach zur Seite, aber trotzdem nach vorne
    function bounce(p, down, side) {
      const rel = side ? Math.sign(ball.x - (p.x + PW / 2)) : Math.max(-1, Math.min(1, (ball.x - (p.x + PW / 2)) / (PW / 2)));
      const a = side ? rel * 1.25 : rel * (Math.abs(rel) > 0.75 ? 1.12 : 0.9);
      ball.sp = Math.min(11, ball.sp + 0.3);

      else if (Math.abs(ball.spin) > 0.2) fl.add(ball.x, ty, ball.spin > 0 ? "Spin ↻" : "Spin ↺", C.sand);

    function hitPaddle(p, down) {

      if (ball.x >= p.x && ball.x <= p.x + PW) {

      fx.step(); fl.step();

      if (k.has("ArrowRight", "d")) { me.x += 7; target = null; }
      if (target !== null) me.x += (target - PW / 2 - me.x) * 0.3;

      me.vx = me.x - mx;

      const aim = ball.vy < 0 ? ball.x + ball.vx * 6 : W / 2;
      ai.x += Math.max(-4.3, Math.min(4.3, (aim - (ai.x + PW / 2)) * 0.11));

      ctx.fillStyle = "rgba(20,30,25,.5)"; ctx.fillRect(0, H / 2 - 3, W, 6);
      ctx.fillStyle = "rgba(246,241,230,.9)"; ctx.fillRect(0, H / 2 - 1, W, 2);

      // Flugbahn sichtbar machen, wenn der Ball Spin hat
      if (Math.abs(ball.spin) > 0.06) {
        ball.trail.forEach((t, i) => { ctx.globalAlpha = (i / ball.trail.length) * 0.4; ctx.fillStyle = C.sand; dot(ctx, t.x, t.y, 2 + (i / ball.trail.length) * 3); });
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = "rgba(0,0,0,.25)";
      ctx.beginPath(); ctx.ellipse(ball.x + 4 + ball.z * 8, ball.y + 5 + ball.z * 10, ball.r, ball.r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      const rad = ball.r + ball.z * 1.5;
      const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 3, 1, ball.x, ball.y, rad);
      bg.addColorStop(0, "#ffffff"); bg.addColorStop(1, "#e9e1d0");
      ctx.fillStyle = bg; dot(ctx, ball.x, ball.y, rad);
      ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
      ctx.strokeStyle = "rgba(120,100,80,.45)"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(0, 0, rad * 0.6, -0.9, 0.9); ctx.stroke();
      ctx.restore();
      fx.draw(ctx); fl.draw(ctx);
      if (state === "ready") overlay(ctx, W, H, "Pong", "Tippen oder Leertaste zum Starten");
      if (state === "over") overlay(ctx, W, H, score[0] > score[1] ? "Gewonnen!" : "Verloren", `${score[0]} : ${score[1]} · Tippen für Revanche`);
    }
    reset();
    const stop = loop(step, draw);
    return () => { stop(); k.off(); s.done(); };
  }

  /* ================= Block Breaker ================= */
  function breakout() {
    const s = stage(400, 600), { ctx, W, H } = s, fx = particles(), fl = floaters(), fxs = effects();
    const COLS = 8, GAP = 5, BW = (W - 24 - GAP * (COLS - 1)) / COLS, BH = 18, ROW = BH + GAP, TOP = 46;
    const LINE = H - 150, ROW_EVERY = 300; // alle 5 Sekunden eine neue Reihe
    const PALETTE = [C.terra, C.sand, C.sage, C.slate, C.clay, C.olive];
    const MIN_A = -Math.PI + 0.32, MAX_A = -0.32;
    const POW = {
      multi: { ic: "multi", name: "Multiball!", good: true, w: 3 },
      slow: { ic: "slow", name: "Langsamer Ball", good: true, w: 2 },
      wide: { ic: "wide", name: "Breiter Schläger", good: true, w: 2 },
      life: { ic: "life", name: "+1 Leben", good: true, w: 1 },
      fire: { ic: "fire", name: "Feuerball!", good: true, w: 2 },
      fast: { ic: "fast", name: "Schneller Ball", good: false, w: 2 },
      narrow: { ic: "narrow", name: "Schmaler Schläger", good: false, w: 2 },
      drop: { ic: "drop", name: "Neue Reihe!", good: false, w: 1.5 },
    };
    const WEIGHTS = Object.fromEntries(Object.entries(POW).map(([k, v]) => [k, v.w]));
    let pad, balls, blocks, drops, booms, lives, score, frames, rowTimer, rowCount;
    let state = "ready", stuck = true, aim = -Math.PI / 2, aiming = false, target = null, shake = 0;
    const level = () => 1 + Math.floor(frames / 1800);
    const speed = () => Math.min(9, 4.8 + level() * 0.3) * (fxs.has("slow") ? 0.65 : 1) * (fxs.has("fast") ? 1.35 : 1);
    const show = () => setScore(`Punkte <b>${score}</b> · Level <b>${level()}</b> · ${"●".repeat(lives)} · Bestwert ${best("breakout")}`);

    function makeBlock(col) {
      const r = Math.random(), lv = level();
      const type = r < 0.06 + lv * 0.006 ? "bomb" : r < 0.16 + lv * 0.015 ? "stone" : r < 0.33 ? "tough" : "normal";
      const hp = { bomb: 1, stone: 3, tough: 2, normal: 1 }[type];
      return { x: 12 + col * (BW + GAP), y: TOP - ROW, ty: TOP, w: BW, h: BH, type, hp, max: hp, color: PALETTE[rowCount % PALETTE.length] };
    }
    function spawnRow() {
      for (const b of blocks) b.ty += ROW;
      for (let c = 0; c < COLS; c++) if (Math.random() < 0.86) blocks.push(makeBlock(c));
      rowCount++;
      rowTimer = ROW_EVERY;
    }
    function dock() { stuck = true; aim = -Math.PI / 2; balls = [{ x: pad.x + pad.w / 2, y: pad.y - 8, vx: 0, vy: -1, r: 7, boost: 1 }]; }
    function reset() {
      lives = 3; score = 0; frames = 0; rowCount = 0; blocks = []; drops = []; booms = []; fxs.clear();
      pad = { x: W / 2 - 46, y: H - 40, w: 92, h: 13 };
      for (let i = 0; i < 4; i++) spawnRow();
      blocks.forEach((b) => (b.y = b.ty));
      dock(); show();
    }
    const clampAim = (a) => Math.max(MIN_A, Math.min(MAX_A, a));
    function aimAt(p) {
      const b = balls[0];
      let a = Math.atan2(p.y - b.y, p.x - b.x);
      if (a > 0) a = p.x < b.x ? MIN_A : MAX_A;
      aim = clampAim(a);
    }
    function launch() {
      if (!stuck || state !== "play") return;
      stuck = false;
      const b = balls[0];
      b.vx = Math.cos(aim); b.vy = Math.sin(aim);
    }
    function begin() { if (state === "over") reset(); state = "play"; }
    const k = keys((key) => { if (key === " " || key === "ArrowUp" || key === "Enter") { if (state !== "play") begin(); else launch(); } });
    s.c.addEventListener("pointerdown", (e) => {
      if (state !== "play") { begin(); return; }
      const p = s.point(e);
      if (stuck) { aiming = true; aimAt(p); } else target = p.x;
    });
    s.c.addEventListener("pointermove", (e) => {
      const p = s.point(e);
      if (stuck && state === "play" && (aiming || e.pointerType === "mouse")) aimAt(p);
      else if (!stuck && (e.pointerType === "mouse" || e.buttons)) target = p.x;
    });
    s.c.addEventListener("pointerup", () => { if (aiming) { aiming = false; launch(); } });
    s.c.addEventListener("pointercancel", () => (aiming = false));

    function damage(b, dmg, ball) {
      if (b.hp <= 0) return;
      b.hp -= dmg;
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      if (b.hp > 0) { fx.burst(cx, cy, b.type === "stone" ? "#cfc8bd" : C.cream, 5, 1.4, 2.5); return; }
      score += { normal: 10, tough: 20, stone: 40, bomb: 30 }[b.type] * level();
      fx.burst(cx, cy, b.type === "stone" ? "#9a948b" : b.type === "bomb" ? "#e0a050" : b.color, 14, 2.5, 4);
      if (b.type === "bomb") explode(b, ball);
      else if (Math.random() < 0.17) drops.push({ x: cx, y: cy, type: pick(WEIGHTS), vy: 1.7, t: 0 });
    }
    // Bombe: Flächenschaden + Ball wird weggeschleudert (zur Seite oder nach oben)
    function explode(b, ball) {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2, R = 66;
      booms.push({ x: cx, y: cy, r: 10, life: 24 });
      shake = 12;
      fx.burst(cx, cy, C.terra, 24, 4, 4); fx.burst(cx, cy, C.sand, 16, 3, 3); fx.burst(cx, cy, "#5a524a", 10, 2, 5);
      for (const o of blocks) {
        if (o === b || o.hp <= 0) continue;
        const dx = o.x + o.w / 2 - cx, dy = o.y + o.h / 2 - cy;
        if (dx * dx + dy * dy <= R * R) damage(o, 1, null);
      }
      if (ball) {
        const dx = ball.x - cx, dy = ball.y - cy;
        if (Math.abs(dx) / (b.w / 2) > Math.abs(dy) / (b.h / 2)) { ball.vx = Math.sign(dx) || 1; ball.vy = -0.4; }
        else { ball.vx = (dx / (b.w / 2)) * 0.45; ball.vy = -1; }
        ball.boost = 1.7;
        fl.add(cx, cy - 8, "BOOM!", C.sand);
      }
    }
    function apply(d) {
      const p = POW[d.type];
      fl.add(d.x, pad.y - 16, p.name, p.good ? "#c9e0bc" : "#f0b49a");
      if (d.type === "multi") {
        const extra = [];
        for (const b of balls) {
          for (const da of [-0.45, 0.45]) {
            if (balls.length + extra.length >= 12) break;
            const a = Math.atan2(b.vy, b.vx) + da;
            extra.push({ x: b.x, y: b.y, vx: Math.cos(a), vy: Math.sin(a), r: 7, boost: b.boost });
          }
        }
        balls.push(...extra);
      } else if (d.type === "slow") { fxs.del("fast"); fxs.add("slow", 600, p.ic, true); }
      else if (d.type === "fast") { fxs.del("slow"); fxs.add("fast", 480, p.ic, false); }
      else if (d.type === "wide") { fxs.del("narrow"); fxs.add("wide", 720, p.ic, true); }
      else if (d.type === "narrow") { fxs.del("wide"); fxs.add("narrow", 540, p.ic, false); }
      else if (d.type === "fire") fxs.add("fire", 420, p.ic, true);
      else if (d.type === "life") lives = Math.min(5, lives + 1);
      else if (d.type === "drop") spawnRow();
      show();
    }
    function moveBall(ball) {
      const sp = speed() * ball.boost;
      ball.boost = 1 + (ball.boost - 1) * 0.985;
      const len = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = (ball.vx / len) * sp; ball.vy = (ball.vy / len) * sp;
      if (Math.abs(ball.vy) < sp * 0.22) {
        ball.vy = (ball.vy < 0 ? -1 : 1) * sp * 0.22;
        ball.vx = (ball.vx < 0 ? -1 : 1) * Math.sqrt(sp * sp - ball.vy * ball.vy);
      }
      const n = Math.ceil(sp / 2.5);
      for (let i = 0; i < n; i++) {
        ball.x += ball.vx / n; ball.y += ball.vy / n;
        if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
        if (ball.y < ball.r) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }
        if (ball.vy > 0 && ball.y + ball.r >= pad.y && ball.y - ball.r <= pad.y + pad.h && ball.x >= pad.x - ball.r && ball.x <= pad.x + pad.w + ball.r) {
          const rel = Math.max(-1, Math.min(1, (ball.x - (pad.x + pad.w / 2)) / (pad.w / 2)));
          ball.vx = Math.sin(rel * 1.05); ball.vy = -Math.cos(rel * 1.05);
          ball.y = pad.y - ball.r;
          const l2 = Math.hypot(ball.vx, ball.vy); ball.vx *= sp / l2; ball.vy *= sp / l2;
        }
        for (const b of blocks) {
          if (b.hp <= 0) continue;
          const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w)), ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
          const dx = ball.x - nx, dy = ball.y - ny;
          if (dx * dx + dy * dy > ball.r * ball.r) continue;
          if (fxs.has("fire")) { damage(b, 99, ball); continue; } // Feuerball schlägt durch
          if (Math.abs(dx) > Math.abs(dy)) ball.vx = (dx > 0 ? 1 : -1) * Math.abs(ball.vx);
          else ball.vy = (dy > 0 || (dy === 0 && ball.vy < 0) ? 1 : -1) * Math.abs(ball.vy);
          damage(b, 1, ball);
          break;
        }
      }
      if (fxs.has("fire") && Math.random() < 0.6) fx.burst(ball.x, ball.y, Math.random() < 0.5 ? C.terra : C.sand, 1, 0.6, 3);
      return ball.y < H + 20;
    }
    function end() { state = "over"; shake = 10; saveBest("breakout", score); show(); }

    function step() {
      fx.step(); fl.step();
      if (shake > 0) shake--;
      for (const b of booms) { b.r += 4; b.life--; }
      booms = booms.filter((b) => b.life > 0);
      for (const b of blocks) b.y += (b.ty - b.y) * 0.15;
      if (state !== "play") return;
      const tw = fxs.has("wide") ? 140 : fxs.has("narrow") ? 60 : 92;
      const mid = pad.x + pad.w / 2;
      pad.w += (tw - pad.w) * 0.15;
      pad.x = Math.max(0, Math.min(W - pad.w, mid - pad.w / 2));
      if (stuck) {
        if (k.has("ArrowLeft", "a")) aim = clampAim(aim - 0.035);
        if (k.has("ArrowRight", "d")) aim = clampAim(aim + 0.035);
        balls[0].x = pad.x + pad.w / 2; balls[0].y = pad.y - balls[0].r - 1;
        return;
      }
      frames++;
      fxs.step();
      if (--rowTimer <= 0) spawnRow();
      if (k.has("ArrowLeft", "a")) { pad.x -= 8; target = null; }
      if (k.has("ArrowRight", "d")) { pad.x += 8; target = null; }
      if (target !== null) pad.x += (target - pad.w / 2 - pad.x) * 0.35;
      pad.x = Math.max(0, Math.min(W - pad.w, pad.x));
      balls = balls.filter(moveBall);
      for (const d of drops) {
        d.y += d.vy; d.t++;
        if (d.y + 9 > pad.y && d.y - 9 < pad.y + pad.h && d.x > pad.x - 18 && d.x < pad.x + pad.w + 18) { d.caught = true; apply(d); }
      }
      drops = drops.filter((d) => !d.caught && d.y < H + 20);
      blocks = blocks.filter((b) => b.hp > 0);
      if (!balls.length) {
        lives--; shake = 8;
        if (lives <= 0) return end();
        fxs.del("fire");
        dock();
        show();
      }
      if (blocks.some((b) => b.y + b.h > LINE)) return end();
      if (frames % 20 === 0) show();
    }

    function drawBlock(b) {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      shadow(ctx, 6, 3, 0.35);
      if (b.type === "bomb") {
        ctx.fillStyle = "#3b3530"; rr(ctx, b.x, b.y, b.w, b.h, 5); ctx.fill();
        noShadow(ctx);
        ctx.strokeStyle = Math.floor(performance.now() / 180) % 2 ? C.terra : "#8a3a2a"; ctx.lineWidth = 1.5;
        rr(ctx, b.x + 1, b.y + 1, b.w - 2, b.h - 2, 4); ctx.stroke();
        drawIcon(ctx, "bomb", cx - 1, cy + 1, 15, "#efe6d6", "#3b3530");
        if (Math.random() < 0.5) { ctx.fillStyle = Math.random() < 0.5 ? C.sand : C.terra; dot(ctx, cx + 4.6, cy - 5.6, 1.2 + Math.random() * 1.2); }
        return;
      }
      if (b.type === "stone") {
        const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
        g.addColorStop(0, "#aaa49b"); g.addColorStop(1, "#7a756e");
        ctx.fillStyle = g; rr(ctx, b.x, b.y, b.w, b.h, 4); ctx.fill();
        noShadow(ctx);
        ctx.fillStyle = "rgba(60,55,50,.35)";
        dot(ctx, b.x + b.w * 0.25, b.y + 6, 1.4); dot(ctx, b.x + b.w * 0.7, b.y + 11, 1.6); dot(ctx, b.x + b.w * 0.5, b.y + 14, 1.1);
      } else {
        const g = ctx.createLinearGradient(0, b.y, 0, b.y + b.h);
        g.addColorStop(0, shade(b.color, 0.12)); g.addColorStop(1, shade(b.color, -0.14));
        ctx.fillStyle = g; rr(ctx, b.x, b.y, b.w, b.h, 4); ctx.fill();
        noShadow(ctx);
        if (b.type === "tough" && b.hp === b.max) { ctx.strokeStyle = "rgba(40,30,20,.5)"; ctx.lineWidth = 1.5; rr(ctx, b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3, 3); ctx.stroke(); }
      }
      ctx.fillStyle = "rgba(255,255,255,.2)"; rr(ctx, b.x + 2, b.y + 2, b.w - 4, 3, 2); ctx.fill();
      const cracks = b.max - b.hp;
      if (cracks > 0) {
        ctx.strokeStyle = "rgba(40,30,20,.6)"; ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 3); ctx.lineTo(b.x + b.w * 0.45, b.y + b.h * 0.55); ctx.lineTo(b.x + b.w * 0.38, b.y + b.h - 3);
        ctx.moveTo(b.x + b.w * 0.45, b.y + b.h * 0.55); ctx.lineTo(b.x + b.w * 0.68, b.y + b.h * 0.4);
        if (cracks > 1) { ctx.moveTo(b.x + b.w * 0.75, b.y + 3); ctx.lineTo(b.x + b.w * 0.62, b.y + b.h * 0.6); ctx.lineTo(b.x + b.w * 0.8, b.y + b.h - 3); }
        ctx.stroke();
      }
    }
    function trajectory() {
      const pts = [], b0 = balls[0];
      let x = b0.x, y = b0.y, vx = Math.cos(aim), vy = Math.sin(aim);
      for (let i = 0; i < 70; i++) {
        x += vx * 5; y += vy * 5;
        if (x < b0.r) { x = b0.r; vx = -vx; }
        if (x > W - b0.r) { x = W - b0.r; vx = -vx; }
        if (y < b0.r) { y = b0.r; vy = -vy; }
        const hit = blocks.find((b) => b.hp > 0 && x > b.x - b0.r && x < b.x + b.w + b0.r && y > b.y - b0.r && y < b.y + b.h + b0.r);
        pts.push({ x, y, hit: !!hit });
        if (hit) break;
      }
      return pts;
    }
    function draw() {
      ctx.save();
      if (shake) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#2e2a25"); g.addColorStop(1, "#1f1c19");
      ctx.fillStyle = g; ctx.fillRect(-12, -12, W + 24, H + 24);
      // Gefahrenlinie: wird kräftiger, je näher die Blöcke kommen
      const lowest = blocks.reduce((m, b) => Math.max(m, b.y + b.h), 0);
      const danger = Math.max(0, Math.min(1, 1 - (LINE - lowest) / (ROW * 3)));
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = `rgba(212,130,95,${0.35 + danger * 0.6 * (0.6 + 0.4 * Math.sin(performance.now() / 150))})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, LINE); ctx.lineTo(W, LINE); ctx.stroke();
      ctx.setLineDash([]);
      for (const b of blocks) drawBlock(b);
      for (const b of booms) {
        ctx.globalAlpha = b.life / 24;
        ctx.strokeStyle = C.sand; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = "rgba(212,130,95,.25)"; dot(ctx, b.x, b.y, b.r * 0.8);
      }
      ctx.globalAlpha = 1;
      // fallende Power-ups
      for (const d of drops) {
        const p = POW[d.type], wob = Math.sin(d.t / 6) * 2;
        token(ctx, p.ic, d.x + wob, d.y, 13, p.good, d.t);
      }
      // Schläger
      shadow(ctx, 10, 4, 0.4);
      const pg = ctx.createLinearGradient(0, pad.y, 0, pad.y + pad.h);
      pg.addColorStop(0, "#d4a877"); pg.addColorStop(1, C.woodDark);
      ctx.fillStyle = pg; rr(ctx, pad.x, pad.y, pad.w, pad.h, 6); ctx.fill();
      noShadow(ctx);
      ctx.fillStyle = "rgba(255,255,255,.25)"; rr(ctx, pad.x + 4, pad.y + 2, pad.w - 8, 2.5, 2); ctx.fill();
      if (state === "play" && stuck) {
        const pts = trajectory();
        pts.forEach((p, i) => { if (i % 3) return; ctx.globalAlpha = Math.max(0.08, 0.85 - i / pts.length); ctx.fillStyle = C.cream; dot(ctx, p.x, p.y, 2.2); });
        const lastP = pts[pts.length - 1];
        if (lastP && lastP.hit) { ctx.globalAlpha = 0.7; ctx.strokeStyle = C.cream; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(lastP.x, lastP.y, 7, 0, Math.PI * 2); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
      const fire = fxs.has("fire");
      for (const ball of balls) {
        shadow(ctx, 6, 3, 0.35);
        const bl = ctx.createRadialGradient(ball.x - 2, ball.y - 3, 1, ball.x, ball.y, ball.r);
        bl.addColorStop(0, fire ? "#ffe3b0" : "#ffffff"); bl.addColorStop(1, fire ? C.terra : "#e3d9c6");
        ctx.fillStyle = bl; dot(ctx, ball.x, ball.y, ball.r);
        noShadow(ctx);
      }
      fx.draw(ctx);
      ctx.restore();
      // Anzeige: Zeit bis zur nächsten Reihe + aktive Effekte
      if (state === "play" && !stuck) {
        ctx.fillStyle = "rgba(226,198,144,.35)"; ctx.fillRect(0, 0, W * (1 - rowTimer / ROW_EVERY), 3);
      }
      fxs.draw(ctx, 8, 9, false);
      fl.draw(ctx);
      if (state === "play" && stuck) {
        ctx.textAlign = "center"; ctx.fillStyle = C.muted; ctx.font = `700 14px ${FONT}`;
        ctx.fillText("Zielen und klicken zum Abschießen", W / 2, H - 12);
      }
      if (state === "ready") overlay(ctx, W, H, "Block Breaker", "Tippen oder Leertaste zum Starten");
      if (state === "over") overlay(ctx, W, H, "Game Over", `${score} Punkte · Tippen für neues Spiel`);
    }
    reset();
    const stop = loop(step, draw);
    return () => { stop(); k.off(); s.done(); };
  }

  /* ================= Sky Jump ================= */
  function jumper() {
    const s = stage(360, 560), { ctx, W, H } = s, fx = particles(), fl = floaters(), fxs = effects();
    const clouds = Array.from({ length: 7 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 0.6 + Math.random() * 0.9, z: 0.15 + Math.random() * 0.35 }));
    const stars = Array.from({ length: 50 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: Math.random() }));
    const ITEMS = {
      boots: { ic: "boots", name: "Raketenstiefel! ↑ halten", good: true, w: 3 },
      shield: { ic: "shield", name: "Schutzblase", good: true, w: 2 },
      jump: { ic: "jump", name: "Supersprung", good: true, w: 2 },
      heavy: { ic: "heavy", name: "Schwer!", good: false, w: 1.5 },
      reverse: { ic: "reverse", name: "Steuerung verdreht!", good: false, w: 1.5 },
    };
    const WEIGHTS = Object.fromEntries(Object.entries(ITEMS).map(([k, v]) => [k, v.w]));
    const BTN = { x: W / 2, y: H - 58, r: 28 };
    let p, plats, height, state = "ready", hold = 0, t = 0, fuel = 0, touchThrust = false, thrusting = false;

    function animate() {

    function drawPlatform(pl) {

    function draw() {
      const tt = Math.min(1, height / 9000);

  }

  /* ================= Snake ================= */

    const ITEMS = {

      slow: { ic: "slow", name: "Zeitlupe", good: true, w: 2 },
      ghost: { ic: "ghost", name: "Geist: durch dich & Wände", good: true, w: 1.5 },
      cut: { ic: "cut", name: "Kürzer!", good: true, w: 1.5 },
      chili: { ic: "chili", name: "Turbo!", good: false, w: 2 },
      dizzy: { ic: "reverse", name: "Steuerung verdreht!", good: false, w: 1.5 },
      fat: { ic: "fat", name: "+3 Länge", good: false, w: 1.5 },

    const WEIGHTS = Object.fromEntries(Object.entries(ITEMS).map(([k, v]) => [k, v.w]));
    let body, prev, dir, queue, food, item, itemIn, state = "ready", tick, every, score, grow, flash = 0, tongue = 0, t = 0;
    const show = () => setScore(`Punkte <b>${score}</b> · Länge ${body.length} · Bestwert ${best("snake")}`);
    const free = (x, y) => !body.some((b) => b.x === x && b.y === y) && !(food && food.x === x && food.y === y) && !(item && item.x === x && item.y === y);
    function spot() { let q; do { q = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) }; } while (!free(q.x, q.y)); return q; }
    function reset() {
      body = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];

    const pad = document.createElement("div");
    pad.className = "dpad";
    pad.innerHTML = `<button type="button" data-d="up" aria-label="Hoch">▲</button><button type="button" data-d="left" aria-label="Links">◀</button><button type="button" data-d="down" aria-label="Runter">▼</button><button type="button" data-d="right" aria-label="Rechts">▶</button>`;
    pad.addEventListener("pointerdown", (e) => {
      const d = e.target.closest("[data-d]");

    });

    function take(type) {
      const it = ITEMS[type], cx = item.x * cell + cell / 2, cy = item.y * cell + cell / 2;
      fl.add(cx, cy - 10, it.name, it.good ? "#e8f2e0" : "#f6c7b3");

      else if (type === "ghost") fxs.add("ghost", 420, it.ic, true);

      else if (type === "chili") { fxs.del("slow"); fxs.add("chili", 360, it.ic, false); }
      else if (type === "dizzy") { fxs.add("dizzy", 300, it.ic, false); queue = []; }

    }

    function step() {

      if (state !== "play") return;

      // Extras tauchen ab und zu auf und verschwinden wieder
      if (item) { if (--item.life <= 0) { item = null; itemIn = 300 + Math.random() * 300; } }
      else if (--itemIn <= 0) { const q = spot(); item = { ...q, type: pick(WEIGHTS), life: 480 }; }
      const baseEvery = Math.max(4, 9 - Math.floor(score / 5));
      every = fxs.has("slow") ? baseEvery + 4 : fxs.has("chili") ? Math.max(2, baseEvery - 3) : baseEvery;
      if (++tick < every) return;

      if (queue.length) dir = queue.shift();
      const ghost = fxs.has("ghost");
      let head = { x: body[0].x + dir.x, y: body[0].y + dir.y };
      if (ghost) head = { x: (head.x + N) % N, y: (head.y + N) % N }; // Geist: durch die Wände
      const eats = head.x === food.x && head.y === food.y;
      const keepTail = eats || grow > 0;
      const hitsSelf = !ghost && body.slice(0, keepTail ? body.length : body.length - 1).some((b) => b.x === head.x && b.y === head.y);
      if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || hitsSelf) {

      body.unshift(head);
      if (keepTail) prev.push({ ...prev[prev.length - 1] });

        score++;

    function draw() {

        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
      // Extra
      if (item) {
        const blink = item.life < 120 && Math.floor(item.life / 8) % 2 === 0;
        if (!blink) {
          const ix = item.x * cell + cell / 2, iy = item.y * cell + cell / 2 + Math.sin(t / 10) * 1.5;
          token(ctx, ITEMS[item.type].ic, ix, iy, cell * 0.52, ITEMS[item.type].good, t);
        }
      }
      const fx0 = food.x * cell + cell / 2, fy0 = food.y * cell + cell / 2 + 1, bob = Math.sin(t / 18);
      ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(fx0 + 2, fy0 + 7, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
      const ag = ctx.createRadialGradient(fx0 - 3, fy0 - 3 + bob, 1, fx0, fy0 + bob, 8);
      ag.addColorStop(0, "#e2735a"); ag.addColorStop(1, "#b8442f");
      ctx.fillStyle = ag; dot(ctx, fx0, fy0 + bob, 7.5);
      ctx.strokeStyle = "#5a3a22"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(fx0, fy0 - 6 + bob); ctx.lineTo(fx0 + 1, fy0 - 10 + bob); ctx.stroke();
      ctx.fillStyle = "#4f7a3a"; ctx.beginPath(); ctx.ellipse(fx0 + 4, fy0 - 9 + bob, 3.5, 1.8, -0.5, 0, Math.PI * 2); ctx.fill();
      // Schlange (weich zwischen den Feldern bewegt; beim Durch-die-Wand-Gehen kein Strich quer übers Feld)
      const f = state === "play" ? Math.min(1, tick / every) : 1;
      const pos = body.map((b, i) => {
        const a = prev[i] || b;
        if (Math.abs(a.x - b.x) > 1 || Math.abs(a.y - b.y) > 1) return { x: b.x * cell + cell / 2, y: b.y * cell + cell / 2 };

      const h = pos[0];
      ctx.fillStyle = ghost ? "#eef2f4" : "#d8c47a"; dot(ctx, h.x, h.y, cell * 0.42);
      if (tongue > 0 && state === "play") {
        ctx.strokeStyle = "#b8442f"; ctx.lineWidth = 1.6;

        ctx.lineTo(tx + (dir.y ? 3 : dir.x * 3), ty + (dir.x ? 3 : dir.y * 3)); ctx.moveTo(tx, ty); ctx.lineTo(tx + (dir.y ? -3 : dir.x * 3), ty + (dir.x ? -3 : dir.y * 3)); ctx.stroke();
      }
      const ox = dir.y ? 4.5 : 0, oy = dir.x ? 4.5 : 0;

        else { ctx.fillStyle = C.ink; dot(ctx, ex + dir.x * 1.2, ey + dir.y * 1.2, 1.7); }
      }
      ctx.globalAlpha = 1;
      fx.draw(ctx);
      fxs.draw(ctx, 6, 6, false);

      if (state === "ready") overlay(ctx, W, W, "Snake", "Pfeiltaste, Wischen oder Tippen zum Starten");
      if (state === "over") overlay(ctx, W, W, "Game Over", `${score} Punkte · Tippen für neues Spiel`);
